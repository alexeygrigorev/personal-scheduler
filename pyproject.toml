[project]
name = "personal-scheduler"
version = "0.1.0"
description = "Personal scheduling service (Calendly replacement) for a single host"
requires-python = ">=3.12"

# What has to be packaged into the Lambda. `make build` exports exactly this set
# to src/requirements.txt for SAM; that file is generated, never edited.
dependencies = [
    "PyJWT[crypto]==2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb]>=5",
    "requests>=2.32",
    # The Lambda runtime ships boto3, so shipping our own would add megabytes
    # and shadow the version AWS actually patches. Needed locally to run tests.
    "boto3>=1.35",
]

# An application, not a library: nothing here is meant to be built or installed.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
